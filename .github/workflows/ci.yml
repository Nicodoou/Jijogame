name: CI

on:
  pull_request:
  push:
    branches: [main, a/6-configuracion]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ROKIT_VERSION: 1.2.0
      ROKIT_ZIP_SHA256: 951a7f3ec3d2a5e021fd1867d32f69f010ee4c2927f644b759578afc59c65fc0
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rokit desde su release oficial
        run: |
          curl --fail --silent --show-error --location --output rokit.zip \
            "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip"
          echo "${ROKIT_ZIP_SHA256}  rokit.zip" | sha256sum --check
          unzip rokit.zip rokit -d "${RUNNER_TEMP}/rokit"
          chmod +x "${RUNNER_TEMP}/rokit/rokit"
          "${RUNNER_TEMP}/rokit/rokit" self-install
          echo "${HOME}/.rokit/bin" >> "${GITHUB_PATH}"

      - name: Confiar en las herramientas de rokit.toml e instalarlas
        run: |
          sed -n 's/^[^=]*= *"\([^@]*\)@.*/\1/p' rokit.toml | xargs -n 1 rokit trust
          rokit install

      - name: Chequeos
        run: scripts/check-all.sh

      - name: Armar el lugar con Rojo
        run: rojo build default.project.json --output build.rbxl
